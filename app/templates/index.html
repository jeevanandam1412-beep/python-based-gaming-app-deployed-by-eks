<!DOCTYPE html>
<html>
<head>
    <title>Guess the Number</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
            padding-top: 100px;
        }

        .game {
            width: 400px;
            margin: auto;
            padding: 40px;
            background: #1f2937;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        input {
            padding: 12px;
            width: 150px;
            border-radius: 8px;
            border: none;
            font-size: 18px;
        }

        button {
            padding: 12px 20px;
            margin-left: 10px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            margin-top: 25px;
            font-size: 20px;
        }
    </style>
</head>

<body>

<div class="game">

    <h1>🎮 Guess the Number</h1>

    <p>I'm thinking of a number between 1 and 100.</p>

    <form method="POST">

        <input
            type="number"
            name="guess"
            min="1"
            max="100"
            required
        >

        <button type="submit">
            Guess
        </button>

    </form>

    <div class="message">
        {{ message }}
    </div>

    <p>
        Attempts: {{ attempts }}
    </p>

</div>

</body>
</html>
